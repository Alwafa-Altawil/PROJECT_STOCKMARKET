<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main buildings shape -->
  <g id="buildings">
    <!-- Left building -->
    <rect x="80" y="150" width="50" height="150" fill="#ffffff" rx="4"/>
    <!-- Middle building (taller) -->
    <rect x="155" y="100" width="50" height="200" fill="#ffffff" rx="4"/>
    <!-- Right building -->
    <rect x="230" y="140" width="50" height="160" fill="#ffffff" rx="4"/>
  </g>
  
  <!-- Curved line/wave -->
  <path d="M 70 200 Q 120 150 170 160 T 270 140 L 330 200" 
        stroke="#ffffff" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Circle background for logo mark -->
  <circle cx="200" cy="200" r="180" fill="url(#logoGradient)" opacity="0.95"/>
  
  <!-- Text: TradeXpert -->
  <text x="200" y="340" font-size="48" font-weight="bold" text-anchor="middle" fill="#1e40af" font-family="Arial, sans-serif">
    TradeXpert
  </text>
</svg>
